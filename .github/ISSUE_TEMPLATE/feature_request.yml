name: Feature request
description: Suggest an idea or enhancement
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's the gap or pain point? Who has it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How would you like it to work? Sketches/mocks welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why you didn't pick them.
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Links, prior art, related issues, etc.
