name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust check + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # diff-cover needs full history to compare against the merge base

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev libdbus-1-dev \
            libgtk-3-dev libayatana-appindicator3-dev libsoup-3.0-dev \
            pkg-config build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.85.4
        with:
          tool: cargo-llvm-cov

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # Tauri's build.rs validates that every `externalBin` exists on disk,
      # so we have to build and stage mcp-linux-control before any cargo
      # workspace step touches src-tauri.
      - name: Stage MCP sidecar
        run: bash scripts/prepare-sidecar.sh

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo llvm-cov (runs tests + emits lcov)
        # Exclude files that are framework / subprocess glue, not business
        # logic: Tauri entry points (lib.rs, main.rs) wrap commands; agent.rs
        # orchestrates the `claude` subprocess and event stream. These need
        # integration tests (with mocked subprocesses), which are out of scope
        # for the per-PR unit gate. Storage + pure helpers in storage.rs etc.
        # remain fully gated.
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --no-fail-fast --lcov \
            --output-path coverage/rust.lcov.info \
            --ignore-filename-regex 'src-tauri/src/(lib|main|agent)\.rs$'

      - name: Upload Rust coverage
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: coverage/rust.lcov.info
          if-no-files-found: error

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun install
        run: bun install --frozen-lockfile

      - name: tsc
        run: bun x tsc --noEmit

      - name: vitest (with coverage)
        run: bun run test:coverage

      - name: vite build
        run: bun run build

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: coverage/lcov.info
          if-no-files-found: error

  diff-coverage-gate:
    name: Diff coverage >= 90%
    needs: [rust, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # diff-cover walks history to find the merge base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install diff-cover
        run: pip install "diff-cover>=9"

      - name: Download Rust coverage
        uses: actions/download-artifact@v7
        with:
          name: rust-coverage
          path: coverage/

      - name: Download frontend coverage
        uses: actions/download-artifact@v7
        with:
          name: frontend-coverage
          path: coverage/frontend/

      - name: Compute merge base
        id: base
        run: |
          BASE_SHA=$(git merge-base origin/${{ github.base_ref }} HEAD)
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"

      # diff-cover only gates lines that are BOTH in the PR diff AND in the
      # lcov report. Test files, type-decl files, and src/index.tsx are
      # excluded from the lcov reports (via vitest config + cargo defaults),
      # so they're automatically out of scope here — no extra --include needed.

      - name: Rust diff-cover gate (>=90%)
        run: |
          diff-cover coverage/rust.lcov.info \
            --compare-branch=${{ steps.base.outputs.base }} \
            --fail-under=90

      - name: Frontend diff-cover gate (>=90%)
        run: |
          diff-cover coverage/frontend/lcov.info \
            --compare-branch=${{ steps.base.outputs.base }} \
            --fail-under=90
