[workspace]
resolver = "2"
members = ["src-tauri", "crates/mcp-linux-control"]

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["linux-coworker-ui"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
